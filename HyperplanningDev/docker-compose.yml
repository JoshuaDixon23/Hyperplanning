services:
  mysql:
    image: mysql:8.1
    container_name: hyperplanning-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hyperplanning_db
    ports:
      - "3306:3306"  # exposer MySQL sur le port local
    volumes:
      - db_data:/var/lib/mysql  # persistance des données

  app:
    build: .
    container_name: hyperplanning-app
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://hyperplanning-db:3306/hyperplanning_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

volumes:
  db_data: